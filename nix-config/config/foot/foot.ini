# foot terminal, ported from sircmpwn's .config/foot/foot.ini.
# Deviations: no shell=xc (his experimental shell; bash stays), and
# xdg-open/notify-send resolve from the nix profile here.
# Out-of-store symlink: edit here, takes effect on next foot launch.

font=Atkinson Hyperlegible Mono Medium:size=12

initial-window-size-chars=80x24
pad=0x0

[bell]
urgent=yes

[url]
launch=xdg-open ${url}

[colors]
alpha=0.95
foreground=f0f0f0
background=101010
regular0=383838  # black
regular1=f2777a  # red
regular2=b9ca4a  # green
regular3=e6c547  # yellow
regular4=7aa6da  # blue
regular5=c397d8  # magenta
regular6=70c0ba  # cyan
regular7=ffffff  # white
bright0=888888   # bright black
bright1=ff3334   # bright red
bright2=9ec400   # bright green
bright3=e7c547   # bright yellow
bright4=7aa6da   # bright blue
bright5=b77ee0   # bright magenta
bright6=54ced6   # bright cyan
bright7=ffffff   # bright white
selection-foreground=080F20
selection-background=d3d0c8

[key-bindings]
show-urls-launch=Control+Shift+f
show-urls-copy=Control+Mod1+f
