foreground=f0f0f0
background=101010
regular0=383838
regular1=f2777a
regular2=b9ca4a
regular3=e6c547
regular4=7aa6da
regular5=c397d8
regular6=70c0ba
regular7=ffffff
bright0=888888
bright1=ff3334
bright2=9ec400
bright3=e7c547
bright4=7aa6da
bright5=b77ee0
bright6=54ced6
bright7=ffffff
selection-foreground=080F20
selection-background=d3d0c8

[key-bindings]
show-urls-launch=Control+Shift+f
show-urls-copy=Control+Mod1+f
